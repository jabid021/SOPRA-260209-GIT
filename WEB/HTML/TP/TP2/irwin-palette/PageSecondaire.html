<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
    />

    <style>
      body {
        margin: 0;
        background: linear-gradient(-90deg, #294c60, #adb6c4, #ffefd3, #ffc49b);
        background-size: 400% 400%;
        animation: gradientAnimation 15s infinite;
      }

      button {
        display: flex;
        margin: 0 auto;
        justify-content: center;
        align-items: center;
        width: 200px;
        height: 50px;
        font-size: 18px;
        background-color: #333;
        color: #fff;
        cursor: pointer;
        color: #fff;
        font-weight: bold;
        background-color: #333;
        border: none;
        border-radius: 25px;
        box-shadow: 0 10px 16px #00000066;
      }

      h1 {
        display: flex;
        color: #fff;
        text-shadow:
          -5px -5px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          3px 3px 0 #000;
        background-color: #00000040;
        border-radius: 8px 8px 0 0;
        box-shadow: 0 4px 6px #00000066;
        font-size: 60px;
        padding: 10px;
        font-family: "Creepster", cursive;
        justify-content: center;
        align-items: center;
      }

      #palette {
        margin: 10% auto;
        background-color: #00000080;
        border-radius: 15px;
        font-family: "Fredoka One", cursive;
        box-shadow: 0 10px 16px #00000066;
      }

      th {
        color: #fff;
        font-weight: bold;
        background-color: #333;
        border-radius: 15px;
        padding-inline: 10px;
      }

      td {
        text-align: center;
        color: #fff;
        background-color: #b8b8b8;
        border-radius: 15px;
        padding-inline: 10px;
      }

      td.swatch {
        color: #fff;
        background-color: #b8b8b8;
        border-radius: 15px;
        width: 60%;
      }

      .row-294c60 td {
        background-color: #294c6066;
      }
      .row-adb6c4 td {
        background-color: #adb6c466;
      }
      .row-ffefd3 td {
        background-color: #ffefd366;
      }
      .row-ffc49b td {
        background-color: #ffc49b66;
      }

      .row-294c60 td.swatch {
        background-color: #294c60;
      }
      .row-adb6c4 td.swatch {
        background-color: #adb6c4;
      }
      .row-ffefd3 td.swatch {
        background-color: #ffefd3;
      }
      .row-ffc49b td.swatch {
        background-color: #ffc49b;
      }

      @keyframes gradientAnimation {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        text-align: center;
        font-family: cursive;
      }

      .ludicolo {
        width: 30px;
        height: 30px;
        vertical-align: middle;
        animation: spin 8s infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <title>Bourg Palette</title>
  </head>

  <body>
    <h1>Générateur de palette de couleur</h1>

    <table id="palette">
      <thead>
        <tr>
          <th>Couleur</th>
          <th>Plus d'informations</th>
          <th>Code Hexadécimal</th>
          <th>Visuel</th>
        </tr>
      </thead>

      <tbody>
        <tr class="row-294c60">
          <td>Bleu charbon</td>
          <td>
            <a href="https://coolors.co/294c60" target="_blank">
              <i
                class="fas fa-arrow-up-right-from-square"
                style="font-size: 20px; color: white"
              ></i>
            </a>
          </td>
          <td>#294c60</td>
          <td class="swatch"></td>
        </tr>

        <tr class="row-adb6c4">
          <td>Ardoise pâle</td>
          <td>
            <a href="https://coolors.co/adb6c4" target="_blank">
              <i
                class="fas fa-arrow-up-right-from-square"
                style="font-size: 20px; color: white"
              ></i>
            </a>
          </td>
          <td>#adb6c4</td>
          <td class="swatch"></td>
        </tr>

        <tr class="row-ffefd3">
          <td>Crème papaye</td>
          <td>
            <a href="https://coolors.co/ffefd3" target="_blank">
              <i
                class="fas fa-arrow-up-right-from-square"
                style="font-size: 20px; color: white"
              ></i>
            </a>
          </td>
          <td>#ffefd3</td>
          <td class="swatch"></td>
        </tr>

        <tr class="row-ffc49b">
          <td>Éclat pêche</td>
          <td>
            <a href="https://coolors.co/ffc49b" target="_blank">
              <i
                class="fas fa-arrow-up-right-from-square"
                style="font-size: 20px; color: white"
              ></i>
            </a>
          </td>
          <td>#ffc49b</td>
          <td class="swatch"></td>
        </tr>
      </tbody>
    </table>

    <button onclick="location.href = 'BourgPalette.html'">
      Palette suivante
    </button>

    <footer>
      <p>
        <span
          ><img
            class="ludicolo"
            src="assets/image/ludicolo.png"
            alt="Ludicolo" /></span
        >© 2026 Irwin Hecker
        <span
          ><img class="ludicolo" src="assets/image/ludicolo.png" alt="Ludicolo"
        /></span>
      </p>
    </footer>
  </body>
</html>
