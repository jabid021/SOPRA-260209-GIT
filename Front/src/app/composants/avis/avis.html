<div class="container">
  <h2>Liste des avis</h2>

  <button class="btn-primary" (click)="openAddForm()">Ajouter un avis</button>

  <div *ngIf="showForm" class="mt-3">
    <h3>{{ isEditing ? 'Modifier' : 'Ajouter' }} un avis</h3>

    <form>
      <input type="number"
             min="0" max="5"
             placeholder="Note (/5)"
             [(ngModel)]="formData.note"
             name="note"
             required /><br>

      <select [(ngModel)]="formData.livreId" name="livreId" required>
        <option value="">-- Choisir un livre --</option>
        <option *ngFor="let livre of livres" [value]="livre.id">
          {{ livre.titre }}
        </option>
      </select><br>

      <input type="date"
             [(ngModel)]="formData.date"
             name="date"
             required /><br>

      <textarea placeholder="Commentaire (optionnel)"
                [(ngModel)]="formData.commentaire"
                name="commentaire"></textarea><br>

      <button type="button" class="btn-primary mt-3" (click)="submit()">
        {{ isEditing ? 'Modifier' : 'Ajouter' }}
      </button>

      <button type="button" class="btn-delete mx-1 mt-3" (click)="cancel()">
        Annuler
      </button>
    </form>
  </div>

  <table class="mt-3">
    <thead>
      <tr>
        <th>Note</th>
        <th>Livre</th>
        <th>Commentaire</th>
        <th>Date</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let avis of avisList">
        <td>{{ avis.note }}/5</td>
        <td>{{ avis.livre?.titre }}</td>
        <td>{{ avis.commentaire }}</td>
        <td>{{ avis.date | date:'shortDate' }}</td>
        <td>
          <button class="btn-edit" (click)="openEditForm(avis)">
            Modifier
          </button>

          <button class="btn-delete mx-1" (click)="delete(avis.id)">
            Supprimer
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
