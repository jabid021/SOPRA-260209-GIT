<div class="container">
  <h2>Liste des collections</h2>

  <button class="btn-primary" (click)="openAddForm()">Ajouter une collection</button>

  <div *ngIf="showForm" class="mt-3">
    <h3>{{ isEditing ? 'Modifier' : 'Ajouter' }} une collection</h3>
    <form>
      <input type="text" placeholder="Nom" [(ngModel)]="formCollection.nom" name="nom" /><br>
      <button type="button" class="btn-primary mt-3" (click)="submit()">
        {{ isEditing ? 'Modifier' : 'Ajouter' }}
      </button>
      <button type="button" class="btn-delete mx-1 mt-3" (click)="cancel()">Annuler</button>
    </form>
  </div>

  <table class="mt-3">
    <thead>
      <tr>
        <th>Nom</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let collection of collections">
        <td>{{ collection.nom }}</td>
        <td>
          <button class="btn-edit" (click)="openEditForm(collection)">Modifier</button>
          <button class="btn-delete mx-1" (click)="delete(collection.id!)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
