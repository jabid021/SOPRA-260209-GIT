<div class="login-container">
  <h2>Connexion</h2>
  <form>
    <input type="text" placeholder="Username" [(ngModel)]="username" name="username" /><br>
    <input type="password" placeholder="Password" [(ngModel)]="password" name="password" /><br>
    <button type="button" (click)="onLogin()" class="btn-primary">Se connecter</button>
  </form>
  @if (erreur) { <p class="erreur">{{ erreur }}</p> }
</div>
