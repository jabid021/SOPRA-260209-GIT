
Hello {{ prenom }}

<input type="text" [value]="prenom" (input)="updatePrenom($event)" />

<button (click)="resetPrenom()">Changer</button>

<hr />

<input type="text" [(ngModel)]="prenom" />

<hr />

<select [(ngModel)]="couleur">
  <option value="black">Noir</option>
  <option value="blue">Bleu</option>
  <option value="red">Rouge</option>
  <option value="#d2138b">Rose flashy</option>
</select>

<input type="color" [(ngModel)]="couleur">

{{ couleur }}

<p [style.color]="couleur">
  Le paragraphe qui change de couleur
</p>

<hr />

<input type="number" [(ngModel)]="formTodo.id" />
<input type="text" [(ngModel)]="formTodo.title" />
<input type="checkbox" [(ngModel)]="formTodo.completed" />
<input type="number" [(ngModel)]="formTodo.userId" />

<p>
  Le titre du Todo : {{ formTodo.title }}
</p>
