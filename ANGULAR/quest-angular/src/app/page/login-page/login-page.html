<h1>Se connecter</h1>

<div>
    <div class="mb-3 row">
        <label for="username" class="col-sm-2 col-form-label">Nom d'utilisateur</label>
        <div class="col-sm-10">
            <input type="text" class="form-control" id="username" [(ngModel)]="formAuth.username" />
        </div>
    </div>

    <div class="mb-3 row">
        <label for="password" class="col-sm-2 col-form-label">Mot de passe</label>
        <div class="col-sm-10">
            <input type="password" class="form-control" id="password" [(ngModel)]="formAuth.password" />
        </div>
    </div>

    <div>
        <button class="btn btn-success" (click)="connexion()">Se connecter</button>
    </div>
</div>
